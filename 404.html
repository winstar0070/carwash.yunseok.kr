<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <title>페이지를 찾을 수 없어요 — 세차 희석비율 계산기</title>
  <style>
    :root { color-scheme: light; --background: #fff; --foreground: #171717; --secondary: #525252; --border: #e5e5e5; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--foreground); font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; line-height: 1.5; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 28px 64px; }
    h1 { margin: 0 0 12px; font-size: 23px; font-weight: 700; letter-spacing: -0.03em; }
    p { margin: 0 0 24px; color: var(--secondary); }
    a { display: inline-flex; min-height: 44px; align-items: center; color: var(--foreground); text-underline-offset: 4px; }
    a:focus-visible { outline: 2px solid var(--foreground); outline-offset: 4px; border-radius: 4px; }
    @media (max-width: 600px) { main { padding: 28px 20px 40px; } h1 { font-size: 21px; } }
  </style>
</head>
<body>
  <main>
    <h1>페이지를 찾을 수 없어요.</h1>
    <p>주소를 확인하거나 계산기로 돌아가 주세요.</p>
    <a href="/">세차 희석비율 계산기로 돌아가기</a>
  </main>
</body>
</html>
