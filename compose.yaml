services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      ORIGIN: ${ORIGIN:-http://localhost:8766}
      RP_ID: ${RP_ID:-localhost}
      DATABASE_URL: postgres://carwash:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/carwash
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: carwash
      POSTGRES_DB: carwash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - carwash-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carwash -d carwash"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  carwash-data:
